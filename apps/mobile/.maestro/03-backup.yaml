# Flow 3 (docs/10 Tier 6): the export/import round trip, as far as a flow can
# drive it. The file round trip itself — export, wipe, import, deep-equal — is
# a packages/db test; what only the simulator can show is that the buttons
# reach the system sheets at all, and that import confirms before it replaces.
appId: ${APP_ID}
name: backup
---
- runFlow:
    file: helpers/open-app.yaml
    env:
      CLEAR_STATE: 'false'
- tapOn:
    id: 'tab-me'
- tapOn:
    id: 'me-settings'
- tapOn:
    id: 'settings-data'
- assertVisible: 'A file you keep'

# Export hands a file to the share sheet. What the sheet contains is in a
# separate process that XCUITest can't see into, so the assertion is that the
# app got there and came back: the button leaves its "Exporting…" state.
- tapOn:
    id: 'backup-export'
- waitForAnimationToEnd:
    timeout: 10000
# Dismissed by tapping the dimmed area above the sheet — a swipe down works
# only sometimes, and Maestro's point taps take integer percentages only. The
# button leaving its "Exporting…" state is the proof the file was handed over.
- tapOn:
    point: '50%,10%'
- extendedWaitUntil:
    visible: 'Export data'
    timeout: 30000

# Import asks before it replaces anything, and backing out changes nothing.
- tapOn:
    id: 'backup-import'
- assertVisible: 'Replace everything on this device?'
- tapOn: 'Cancel'
- assertVisible: 'A file you keep'
